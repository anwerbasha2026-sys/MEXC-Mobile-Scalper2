name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip \
            zlib1g-dev \
            openjdk-17-jdk

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 "cython<3"

      - name: Build Android debug APK
        run: |
          yes | buildozer -v android debug

      - name: Show generated APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Mobile-Scalper-APK
          path: bin/*.apk
          if-no-files-found: error
