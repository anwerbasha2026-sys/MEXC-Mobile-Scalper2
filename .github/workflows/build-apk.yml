name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"
          python -m pip install "python-for-android==2026.5.9"

      - name: Show build environment
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Java ====="
          java -version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== python-for-android ====="
          python -m pip show python-for-android

      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Android APK
        env:
          P4A_NDK_VERSION: "28c"
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show APK files
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

          echo "===== BIN DIRECTORY ====="
          ls -lah bin || true

      - name: Show Gradle error context
        if: failure()
        run: |
          echo "===== LAST 250 BUILD LOG LINES ====="
          tail -n 250 build.log || true

          echo "===== GRADLE LOGS ====="
          find .buildozer -type f \( \
            -name "*.log" -o \
            -name "gradle.log" -o \
            -name "build.log" \
          \) -print 2>/dev/null | head -50 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Mobile-Scalper-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Mobile-Scalper-Build-Log
          path: build.log
          if-no-files-found: warn